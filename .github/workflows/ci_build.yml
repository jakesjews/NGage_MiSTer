name: CI Build
run-name: NGage build (seed ${{ inputs.seed || 'project default' }})

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Quartus fitter seed (1 to 2147483647, blank uses NGage.qsf)
        type: string
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select fitter seed
        id: seed
        env:
          FITTER_SEED: ${{ inputs.seed }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          qsf = Path('NGage.qsf')
          data = qsf.read_bytes()
          assignments = list(re.finditer(
              rb'(?m)^[ \t]*set_global_assignment[ \t]+-name[ \t]+SEED[ \t]+([0-9]+)',
              data,
          ))
          if len(assignments) != 1:
              raise SystemExit('Expected exactly one SEED assignment in NGage.qsf.')

          assignment = assignments[0]
          raw = os.environ['FITTER_SEED'] or assignment[1].decode()
          if not re.fullmatch(r'[0-9]{1,10}', raw) or not 1 <= int(raw) <= 2147483647:
              raise SystemExit('Seed must be an integer from 1 to 2147483647.')

          seed = str(int(raw))
          start, end = assignment.span(1)
          qsf.write_bytes(data[:start] + seed.encode() + data[end:])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'value={seed}\n')
          print(f'Quartus fitter seed: {seed}')
          PY

      - name: Prepare report directories
        run: mkdir -p output_files build

      - name: Build with Quartus 17.0.2
        id: compile
        shell: bash
        run: |
          set -uo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sh --flow compile NGage \
            2>&1 | tee quartus_build.log
          exit "${PIPESTATUS[0]}"

      # Use the timing script's default zero-slack limit at every corner.
      - name: Export and check timing
        id: timing
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -w /project \
            theypsilon/quartus-lite-c5:17.0.2.docker0 \
            /opt/intelFPGA_lite/quartus/bin/quartus_sta -t tools/report_timing.tcl \
            2>&1 | tee quartus_timing_details.log
          exit "${PIPESTATUS[0]}"

      # A compiled core remains available for board experiments when timing
      # fails. The job stays failed; the artifact explicitly records timing.
      - name: Check and label build output
        id: rbf
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          TIMING_RESULT: ${{ steps.timing.outcome }}
          FITTER_SEED: ${{ steps.seed.outputs.value }}
        run: |
          test -s output_files/NGage.rbf
          python3 - <<'PY'
          import hashlib
          import os
          import subprocess
          from pathlib import Path
          rbf = Path('output_files/NGage.rbf')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          timing = os.environ['TIMING_RESULT']
          seed = int(os.environ['FITTER_SEED'])
          # the worst slack of each check over the corners (tools/report_timing.tcl)
          worst = {}
          corners = Path('build/timing-corners.tsv')
          if corners.exists():
              for line in corners.read_text().splitlines()[1:]:
                  _, check, slack = line.split('\t')
                  worst[check] = min(float(slack), worst.get(check, float('inf')))
          met = timing == 'success' and bool(worst) and min(worst.values()) >= 0
          text = (f'Commit: {sha}\nQuartus: 17.0.2\nProject: NGage\n'
                  f'Fitter seed: {seed}\n'
                  f'Timing check: {timing}\n'
                  + ''.join(f'Worst {c} slack: {v:.3f} ns\n' for c, v in worst.items())
                  + f'104 MHz timing met: {"yes" if met else "no"}\n'
                  f'RBF SHA256: {hashlib.sha256(rbf.read_bytes()).hexdigest()}\n')
          if not met:
              text += 'Experimental build: timing closure was not verified.\n'
          Path('build-info.txt').write_text(text)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'label={"timing-met" if met else "timing-check-failed"}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### NGage build\n\n```text\n' + text + '```\n')
          if timing == 'success' and not met:
              raise SystemExit('Timing analysis did not report non-negative slack.')
          PY

      - name: Print errors on failure
        if: failure()
        run: |
          grep -hE 'Error|Critical Warning' quartus_build.log quartus_timing_details.log output_files/*.rpt 2>/dev/null | head -200 || true
          tail -100 quartus_build.log 2>/dev/null || true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quartus-logs
          path: |
            quartus_build.log
            quartus_timing_details.log
            output_files/
            !output_files/NGage.rbf
            build/critical-paths.rpt
            build/hold-paths.rpt
            build/unconstrained-paths.rpt
            build/timing-corners.tsv
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RBF
        if: ${{ !cancelled() && hashFiles('output_files/NGage.rbf') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: NGage-rbf-${{ steps.rbf.outputs.label || 'unverified' }}
          path: |
            output_files/NGage.rbf
            build-info.txt
          if-no-files-found: error
          retention-days: 14
